# CI: the organisation's reusable library pipeline, this package's own build and packaging
# checks, the dependency and license scan, and the check of the required documents.
#
# The generic library jobs (lint, typecheck, unit and end-to-end coverage, mutation) run through
# `node-lib-ci.yml`. What stays here is what is specific to this package: the build, its output
# integrity across every subpath, the packaging, size and documentation gates, and the `docs`
# job that checks the required documents exist and that their relative links resolve.
#
# The aggregate job keeps the name `CI passed`: it is the one check the
# organisation ruleset requires in every repository, matched by literal name.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Documents present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required files exist and are not empty
        run: |
          missing=0
          for f in README.md LICENSE SECURITY.md CODE_OF_CONDUCT.md AGENTS.md docs/spec.md; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::missing or empty"
              missing=1
            fi
          done
          exit "$missing"
      - name: Relative links in Markdown resolve
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = 0
          for path in pathlib.Path('.').rglob('*.md'):
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              for target in re.findall(r'\]\(([^)#\s]+)', path.read_text(encoding='utf-8')):
                  if target.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  if not (path.parent / target).exists():
                      print(f'::error file={path}::broken link to {target}')
                      bad += 1
          sys.exit(1 if bad else 0)
          PY

  ci:
    uses: bymaxone/.github/.github/workflows/node-lib-ci.yml@v1
    with:
      node-version: '26'
      # No `format:check` script exists, so the shared job has nothing to call.
      #
      # Formatting of CODE is gated by lint instead: `prettier/prettier` is an
      # error on every path `pnpm lint` passes (source, unit and end-to-end specs, scripts and
      # the root config files), so a badly formatted source file fails the Lint job.
      #
      # What that does NOT cover, stated because the gap is the reason this input
      # stays `false` rather than a claim that nothing is missing: Markdown, JSON
      # and YAML are formatted by prettier through lint-staged at commit time and
      # by nothing in CI. `README.md` and `CHANGELOG.md` ship in the package, so
      # closing that needs a real `format:check` script and this input flipped to
      # `true`, not a wider eslint glob: eslint does not format those file types.
      run-format-check: false
      run-build: false # build + integrity + size verified in the `verify` job below
      unit-command: pnpm test:cov:all
      run-mutation: true
      mutation-source-globs: '^(src/)'
      # The per-push run is incremental and finishes in minutes; this ceiling is for the cold
      # one: the first run after enabling incremental, and any run whose baseline expired.
      # The job is CANCELLED rather than failed when the ceiling lands, which reads as an
      # infrastructure blip instead of a budget.
      mutation-timeout-minutes: 150

  # Package-specific verification: full build, output integrity across every subpath, the
  # packaging and documentation gates, and the brotli bundle-size budget.
  verify:
    name: Verify build + size
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `check:published` cross-checks every release tag against a CHANGELOG
          # section. The default checkout is shallow and carries no tags, so the
          # check would find nothing and pass: the silent no-op it exists to
          # prevent.
          fetch-depth: 0
          # The steps below run the pull request's own scripts; the read-only token must
          # not stay in the repository's git configuration for them to read.
          persist-credentials: false
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          node-version: '26'
      - name: Mutation directives parse and carry their reason
        run: pnpm check:mutants
      - name: Documentation snippets reference symbols that exist
        # Runs here rather than only before publishing: the defect it catches is
        # introduced by editing a document, so the pull request that edits one is
        # where it has to fail.
        run: pnpm check:docs
      - name: Source files stay within the length limit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A pull request is also compared with the baseline on its base branch, so the baseline
          # it carries cannot admit the offender it adds. The checkout above is not shallow.
          if [ -n "$BASE_REF" ]; then
            pnpm check:file-length --base "origin/$BASE_REF"
          else
            pnpm check:file-length
          fi
      - name: Functions and test bodies stay within the length limit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A pull request is also compared with the baseline on its base branch, so the baseline
          # it carries cannot admit the offender it adds. The checkout above is not shallow.
          if [ -n "$BASE_REF" ]; then
            pnpm check:function-length --base "origin/$BASE_REF"
          else
            pnpm check:function-length
          fi
      - name: Each suite alone meets the coverage gate
        # The `ci` job measures the unit and end-to-end suites combined, which passes when each
        # covers what the other misses. The two commands below hold each suite to 100 on its own.
        run: |
          pnpm test:cov
          pnpm test:e2e
      - name: Build all subpaths
        run: pnpm build
      - name: Verify build output integrity
        run: |
          for subpath in core shared internal revenuecat finance testing; do
            for ext in mjs cjs d.ts d.cts; do
              if [ ! -f "dist/$subpath/index.$ext" ]; then
                echo "Missing dist/$subpath/index.$ext"
                exit 1
              fi
            done
          done
          echo "Every subpath produced ESM + CJS + .d.ts + .d.cts"
      - name: Verify published type resolution
        # Compiling `src` cannot catch a broken `exports` map: a consumer
        # resolving the package through the packed tarball may still land on
        # declarations for the wrong module format. `attw` packs the tarball and
        # resolves every entrypoint the way each module resolution mode would.
        run: pnpm check:exports
      - name: Verify the published surface matches the documentation
        # Three checks, each guarding a defect that would otherwise reach npm:
        # the README's links resolve; its TypeScript snippets compile against `dist/` resolved
        # through the `exports` map, which the source-based suites cannot see; and every
        # `v*.*.*` tag has a CHANGELOG section, the tags being the outside source of truth a
        # file cannot contradict about itself.
        run: pnpm check:published
      - name: Entry points load from the packed tarball
        # Packs the tarball and loads every entry in ESM and CommonJS under the dependency
        # denials: `./shared` with no NestJS package and no optional peer, the other
        # subpaths with no optional peer. Source-based suites cannot see a bundling defect.
        run: pnpm check:runtime
      - name: Bundle size budget
        run: pnpm size

  security:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high

  # Single check the org ruleset can require, in every repo, under one name.
  #
  # A required status check is matched by literal name, and this repo's jobs are
  # named nothing like the next repo's, so there is no list of contexts that
  # works org-wide. One aggregate per repo, always spelled `CI passed`, is what
  # makes a single rule at the organisation level possible.
  #
  # `always()` is what makes this a gate rather than decoration: without it the
  # job is skipped the moment a dependency fails, and a skipped check reports
  # neutral, so the pull request would look unblocked precisely when it is broken.
  # `cancelled` is named explicitly for the same reason; a cancelled job is not
  # a passing one, and a queue timeout produces exactly that.
  #
  # A skipped dependency is accepted on purpose: jobs here are conditional on the
  # event, and failing on skip would break every push that legitimately runs a
  # subset.
  ci-pass:
    name: CI passed
    if: always()
    needs: [docs, ci, verify, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the result of every dependency
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail when any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
